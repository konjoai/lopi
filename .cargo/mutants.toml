# cargo-mutants configuration (Konjo G3 — Mutation Testing).
#
# Exclude untestable IO / entry-point shells from mutation testing. These
# functions carry no branching logic: they delegate to pure, unit-tested
# helpers (e.g. `replay_plan`, `resolve_restart`, `classify`) and only perform
# stdout or database IO that mutation testing cannot meaningfully assert. A
# "replace body with Ok(())" mutant on such a shell can never be killed by a
# unit test, so it would otherwise be a permanent false-positive survivor.
exclude_re = [
    ": replace main -> ",
    "replay_commands\\.rs.*: replace run -> ",
    "replay_commands\\.rs.*: replace print_plan ",
    # `lopi run` CLI entry point — an async IO shell on a par with `main` and
    # `replay_commands::run`. It opens the store, builds the task, constructs the
    # runner (delegating to unit-tested `LoopConfig::load_from_repo`,
    # `AgentRunner::with_self_prompt` / `with_strategy_escalation` /
    # `with_adaptive_retry`), and awaits `.run().await`. No unit-testable branching
    # of its own; a "replace body with Ok(())" mutant can only be killed by a full
    # live-agent harness.
    "run_command\\.rs.*: replace run -> ",
    # `lopi sail` entry point — the async IO shell sibling of `run_command::run`
    # and `replay_commands::run`. It opens the store (honoring the unit-tested
    # `util::expand_home` / `util::db_path` for the path), builds the pool,
    # seeds schedules, spawns the scheduler/ctrl-c tasks, and awaits
    # `serve_with_repo`. Its own status/config logic lives in unit-tested units
    # (`TaskStatus::db_status`, `expand_home`, the `AppState::with_config` +
    # `GET /api/config` handler tests); the shell only wires them together, so a
    # "replace body with Ok(())" mutant can only be killed by a live server harness.
    # Sprint S10, Phase 4 removed the sibling `spawn_telegram` shell entirely
    # (Telegram transport removal) along with its own exclusion entry here.
    "sail_commands\\.rs.*: replace run -> ",
    # REPL goal-dispatch shell (`repl::dispatch_goal`) — spawns the runner and
    # the AgentEvent→ReplEvent bridge on background tasks and persists the
    # terminal status via the unit-tested `TaskStatus::db_status`. No
    # unit-testable branching of its own; killing a "replace body with Ok(())"
    # mutant would need a live runner + TUI event loop, same as the entries above.
    "actions\\.rs.*: replace dispatch_goal -> ",
    # Phase 16.2b — autonomy enforcement. The branching *decisions* live in pure,
    # unit-tested helpers (`pr_decision`, `requires_verifier`, `should_auto_merge`,
    # `plan_gate_applies`, `non_empty_constraint`, `pr_create_args`,
    # `pr_merge_args`, `parse_plan_steps`/`strip_numbered`). The functions below
    # are IO shells: they delegate to those helpers and only run git/gh
    # subprocesses, stream from the model, touch the DB, or emit log lines — none
    # of which a unit test can assert against. The patterns are function-scoped
    # (no trailing `->`/`in`) so inner operator/guard mutants — `attempt + 1`
    # arithmetic, guards on IO results — are excluded along with the body.
    "manager\\.rs.*GitManager::create_pr\\b",
    "manager\\.rs.*GitManager::open_pr\\b",
    "manager\\.rs.*GitManager::open_draft_pr\\b",
    "manager\\.rs.*GitManager::auto_merge\\b",
    "finalize\\.rs.*AgentRunner::finalize\\b",
    "finalize\\.rs.*AgentRunner::apply_pr_decision\\b",
    "finalize\\.rs.*AgentRunner::emit_report\\b",
    "seed\\.rs.*AgentRunner::gather_seed\\b",
    "seed\\.rs.*AgentRunner::seed_from_patterns\\b",
    "speculative\\.rs.*AgentRunner::implement_speculative\\b",
    "speculative\\.rs.*AgentRunner::speculative_plan_failed\\b",
    "plan_gate\\.rs.*AgentRunner::gate_plan\\b",
    "plan_gate\\.rs.*AgentRunner::await_plan_approval\\b",
    # The top-level plan→implement→test→score→retry orchestration loop. Like the
    # excluded `main` / `replay_commands::run` entry points, it only sequences
    # the tested units above (gather_seed, gate_plan, finalize, …) and git IO;
    # its body and the `attempt + 1` index arithmetic can't be pinned without a
    # full live-agent integration harness.
    "run_loop\\.rs.*AgentRunner::run\\b",
    # Phase 16.6 — task-budget enforcement. The decision logic (whether a model
    # accepts a budget, clamping below the API minimum, the wire-shape value)
    # lives in pure, unit-tested helpers in `api_budget.rs`
    # (`supports_task_budget`, `effective_task_budget`, `task_budget_output_config`)
    # and the `AgentRunner::with_task_budget` builder. `stream_plan` is the
    # streaming-IO shell that only forwards those results onto an HTTP request and
    # consumes the SSE response — no unit-testable branching a mutant could pin
    # without a live API harness.
    "api_client\\.rs.*AnthropicClient::stream_plan\\b",
    # Sprint S11 Round 2 — `lopi watch --remote`'s connect/fallback/TUI-driver
    # shell, the same class as `sail_commands::run` and `actions::dispatch_goal`
    # above. Its one unit-testable branch (does the handshake request carry
    # `Authorization: Bearer <token>`) already lives in the pure, unit-tested
    # `ws_request` helper (`no_token_sends_no_authorization_header`,
    # `empty_token_sends_no_authorization_header`,
    # `a_real_token_is_sent_as_a_bearer_header`) — those tests are exactly what
    # caught 2 of this diff's 3 mutants. `watch_remote` itself only awaits a
    # real WebSocket connect and then drives `lopi_ui::tui::run`, a live
    # terminal event loop; a "replace body with Ok(())" mutant here can only be
    # killed by a live-server-plus-real-terminal harness, not a unit test.
    "remote\\.rs.*: replace watch_remote -> ",
    # Demo Mode Sprint — `lopi demo`'s OS-side-effect shells. The one branch
    # with real logic (whether to try opening a browser tab) was extracted
    # into the pure, unit-tested `should_open_browser` — see
    # `should_open_browser_only_false_when_explicitly_suppressed`. These two
    # functions only perform a `Command::new(...).status()` (OS-dependent,
    # environment-dependent, and its result is deliberately discarded — a
    # failed `open`/`xdg-open` must never fail the dashboard launch) or
    # `println!` calls with no branching; a "replace body with ()" mutant on
    # either can never be killed by a unit test, same class as
    # `sail_commands::print_startup_banner` (never itself in a diff mutation
    # testing has run against, but the same rationale would apply).
    "demo_commands\\.rs.*: replace open_dashboard ",
    "demo_commands\\.rs.*: replace print_startup_banner ",
    # REPL ratatui rendering functions (`draw_repl` and its `draw_*` helpers,
    # including `draw_header`) only build `ratatui::text::Line`/`Span` trees
    # and render them into a `Frame` — no branching a unit test can assert
    # against without a `ratatui::backend::TestBackend` harness, which this
    # module has never had (no `mod tests` in `repl/draw.rs` before or after
    # this sprint's cost-label wording change). A "replace body with ()"
    # mutant here is the same permanent false-positive class as the IO
    # shells above.
    "repl/draw\\.rs.*: replace draw_header ",
    # Sprint S13R, Phase D — the panic/resource surface pass introduced
    # `EventSource` (`repl/mod.rs`) so `repl_loop`'s dispatch logic could be
    # unit-tested via a scripted fake (see `repl::tests::
    # repl_loop_exits_cleanly_on_escape_while_idle`, which does exercise the
    # real branching). `CrosstermEvents::next_event`, the production
    # implementation, is a thin two-line delegation to
    # `crossterm::event::poll`/`event::read` with no branching of its own to
    # verify — same class as the IO shells above. Unlike `setup_terminal`'s
    # `enable_raw_mode()?` (which reliably errors with no controlling
    # terminal, and so is unit-tested directly in `run_repl_fails_fast_with_
    # no_controlling_terminal`), `event::poll` returns a normal `Ok(false)` on
    # a non-tty stdin within its timeout — indistinguishable by return value
    # from the "replace with Ok(None)" mutant without a real keyboard or a
    # raw-mode-dependent injected byte stream, which no test in this module
    # sets up.
    "repl/mod\\.rs.*CrosstermEvents::next_event",
]
