# cargo-deny configuration — Konjo Quality Framework
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[licenses]
# cargo-deny 0.16+ denies-by-default: any license not explicitly listed in
# `allow` below is now an error, and `copyleft`/`unlicensed`/`allow-osi-fsf-free`
# were removed as config keys (PR#611/#681) since they're irrelevant once
# everything not allow-listed is denied. This allow list already covered the
# workspace's actual licenses under the old default-allow scheme, so the
# behavior for every crate the workspace already depends on is unchanged;
# the new default-deny only bites a *newly added* dependency with a license
# not in this list, which is exactly the point.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # The ICU/unicode-adjacent stack (icu_*, litemap, tinystr, writeable, yoke,
    # zerofrom, zerovec, zerotrie, potential_utf, unicode-ident) uses this
    # SPDX id (2024) — the current identifier for the same OSI-approved
    # permissive terms the older "Unicode-DFS-2016" id covered. Sprint S4
    # triage, verified 2026-07-24; "Unicode-DFS-2016" itself dropped from
    # this list in Sprint S10 (2026-07-27) — cargo-deny flagged it
    # `unmatched license allowance`, no crate in the tree carries it anymore.
    "Unicode-3.0",
    "Zlib",
    # `webpki-roots` (pulled in via sqlx 0.8's newer rustls chain, Sprint S10
    # Phase 2) ships Mozilla's CA root bundle under this Linux Foundation
    # data license instead of the MPL-2.0 its older version used — a
    # permissive terms-of-use license for the bundled data, not copyleft
    # source-license terms, so it belongs in the blanket allow list rather
    # than a per-crate exception the way MPL-2.0 is scoped below. Verified
    # 2026-07-27 against `webpki-roots` 1.0.9's own `Cargo.toml`.
    "CDLA-Permissive-2.0",
]
# Confidence threshold: crates whose license is ambiguous get denied
confidence-threshold = 0.8

# Copyleft licenses are denied by not being in `allow` above (cargo-deny 0.16+
# denies anything unlisted). These two crates are the only MPL-2.0 dependencies
# in the graph, both build-time/runtime deps consumed unmodified — never
# forked, patched, or redistributed as modified source — so the copyleft
# obligation (share modifications to the MPL-licensed *files themselves*)
# never triggers. Scoped per-crate rather than adding MPL-2.0 to the global
# allow list, so a *future* MPL-2.0 dependency still needs its own review.
# Sprint S4 triage, verified 2026-07-24.
[[licenses.exceptions]]
name = "option-ext"
allow = ["MPL-2.0"]

# `webpki-roots`'s MPL-2.0 exception (Sprint S4) dropped in Sprint S10
# (2026-07-27): the sqlx 0.7 -> 0.8 upgrade (Phase 2) pulled a newer
# `webpki-roots` that no longer carries MPL-2.0 — cargo-deny flagged the old
# exception `unmatched license exception`. Re-add it, scoped the same way,
# if a future `webpki-roots` version reintroduces MPL-2.0.

[advisories]
# rustsec/advisory-db is the Rust security advisory database
db-urls = ["https://github.com/rustsec/advisory-db"]
# Known vulnerabilities: hard block. (cargo-deny 0.19+ removed the top-level
# `vulnerability` severity knob entirely — RUSTSEC vulnerability advisories
# always error, unconditionally. There is no longer a config key for this.)
#
# `unmaintained` and `unsound` are no longer lint-level knobs ("warn"/"deny")
# as of cargo-deny 0.19 — they were repurposed as scope selectors
# ("all"/"workspace"/"transitive"/"none") that control which crates get
# checked at all; a match in scope always errors, there is no soft "warn"
# tier anymore. "workspace" (error only if a workspace crate directly
# depends on the unmaintained/unsound crate, ignore purely transitive ones)
# is the closest equivalent to the old "warn everywhere" intent without
# hard-failing on every unmaintained crate three hops down the tree.
unmaintained = "workspace"
unsound = "workspace"
# Yanked versions: hard block (yanked = the crate author pulled it for a reason)
yanked = "deny"

# Sprint S10, Phase 2 (2026-07-27): the sqlx 0.7 -> 0.8.6 upgrade resolved
# the four advisories previously ignored here (RUSTSEC-2026-0098/-0099/-0104
# rustls-webpki, RUSTSEC-2024-0363 sqlx format-injection) — all traced to
# sqlx 0.7.4's own pinned rustls 0.21/rustls-webpki 0.101; sqlx 0.8.6 pulls
# rustls 0.23.42/rustls-webpki 0.103.13, and none of those four IDs match
# anything in the tree anymore (`cargo audit`/`cargo deny check` re-run
# confirms `advisory-not-detected` for all four; removed rather than left as
# dead entries, which would silently mask a *real* future re-introduction of
# the same ID). `sqlx-mysql`/`sqlx-postgres`/`rsa` are gone from the lock
# entirely — confirmed via `cargo tree -i {rsa,sqlx-mysql,sqlx-postgres}` —
# lopi's `features = ["runtime-tokio-rustls", "sqlite"]` never activated
# them; `RUSTSEC-2023-0071` (rsa Marvin timing attack) needed no entry here
# even before Phase 2 for the same reason.
#
# The four below are `unmaintained`/`unsound` advisories on transitive deps
# (none is a direct workspace dependency, so `unmaintained = "workspace"`/
# `unsound = "workspace"` above don't error on them on their own — these
# entries exist so `cargo audit`, which has no such scope distinction, has a
# matching written exception for each rather than failing CI on a
# transitive-only finding). Re-verify at the next dependency bump that pulls
# any of these transitively, in case a newer release of the parent crate
# drops them.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained — transitive via ratatui 0.26.3; not a direct workspace dependency" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, unmaintained — transitive via teloxide 0.13.0's aquamarine dep; not a direct workspace dependency" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile, unmaintained — transitive via reqwest 0.11.27; not a direct workspace dependency" },
    { id = "RUSTSEC-2026-0002", reason = "lru, unsound (IterMut/Stacked Borrows) — transitive via ratatui 0.26.3; not a direct workspace dependency, and lopi never calls IterMut through this path" },
]

[bans]
# Duplicate versions of the same crate waste compile time and inflate binary size.
# Warn, not deny — blocking on transitive version drift would be too disruptive.
multiple-versions = "warn"
# Wildcard version specs ("*") make reproducible builds impossible
wildcards = "deny"
# Highlight crates (not banned, just tracked for awareness)
highlight = "simplest-path"

# Example bans — add as the project grows:
# deny = [
#   { name = "openssl", reason = "prefer rustls; openssl links a C library" },
# ]

[sources]
# Only allow crates from crates.io — no unknown registries or git sources in production
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
