# Recipe: dependency-bump — update dependencies, gated on the test suite.
#
# Apply: copy this file to <repo>/.lopi/loop.toml, adjust `gate`/`until` if
# this isn't a cargo workspace, then:
#   lopi run --goal "update dependencies to the latest compatible versions, keep tests green" --repo <repo>
#
# REQUIRED PREREQUISITE — confirmed live (see README): every attempt fails
# without this. Add to <repo>/.lopi.toml (create it if absent) first:
#   allowed_dirs = ["src/", "tests/", "Cargo.lock"]
# Full rationale: recipes/dependency-bump/README.md

autonomy_level = "draft_pr"     # F6 — L2: a dependency bump always opens a PR for review,
                                 # never merges itself, however many times it's run clean.
verifier_required = true        # F2 — maker != checker: a second, differently-modeled pass
                                 # grades the bump before the PR opens. A dependency update can
                                 # pass every existing test and still be a bad idea (a semver-
                                 # compliant but behaviorally-risky release) — worth a second
                                 # opinion, unlike the purely mechanical fix-failing-test/
                                 # lint-burndown recipes.

# F3 — three hard stops, set explicitly.
max_iterations = 5
no_progress_limit = 2

# F1 — precondition (`gate`) confirms the baseline is actually green before
# touching anything, so a pre-existing red test is never blamed on the bump;
# `until` (the same command) ends the loop once the bump lands with tests
# still green.
gate = "cargo test --workspace"
until = "cargo test --workspace"

# F5 — a lockfile write is exactly the kind of change that corrupts a
# concurrently-running loop's checkout if both share one working directory.
isolation = "worktree"

# F6, continued — earned-trust promotion: after 5 consecutive clean,
# verifier-passed bumps, promote one rung to verified_pr (L3, still no
# auto-merge — trust_ceiling caps it there). A repo that has watched 5
# uneventful dependency PRs in a row has earned running the *next* one
# without a human replaying the same review each time; it has not earned
# skipping review forever.
promote_after = 5
trust_ceiling = "verified_pr"

# NOTE: `[budget]` must come last — every key after a `[table]` header
# belongs to that table in TOML, not the top level.
[budget]
preset = "standard"             # $1 / 1M tokens — a bump can touch a lockfile plus several
                                 # call sites if a dependency's API shifted; quick's 200K-token
                                 # ceiling is comfortable for one bump but tight for a
                                 # multi-dependency sweep, so this recipe defaults one notch up.
