# fly.toml — lopi deployment on fly.io
#
# Deploy: fly deploy
# Secrets: fly secrets set LOPI_WEB_AUTH_TOKEN=...
#
# lopi is single-operator, single-machine by design (Sprint S12 scope
# lock — see LEDGER.md and SECURITY.md's "Deployment model"). This config
# runs exactly one process: `lopi sail`, the Forge dashboard + agent API.
# The GitHub App OAuth + Stripe billing server (`lopi serve-app`) that used
# to run alongside it here was removed, not hardened — there is no
# multi-tenant surface left to deploy.

app = "lopi"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# ─── Process groups ────────────────────────────────────────────────────────────

[processes]
  web = "lopi sail --port 3000 --host 0.0.0.0"

# ─── HTTP services ─────────────────────────────────────────────────────────────

[[services]]
  protocol    = "tcp"
  internal_port = 3000
  processes   = ["web"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [services.http_checks]
    interval      = "15s"
    timeout       = "5s"
    grace_period  = "10s"
    method        = "GET"
    path          = "/api/health"
    protocol      = "http"
    tls_skip_verify = false

# ─── Persistent volume ────────────────────────────────────────────────────────

[[mounts]]
  source      = "lopi_data"
  destination = "/home/lopi/.lopi"
  processes   = ["web"]

# ─── Environment ──────────────────────────────────────────────────────────────

[env]
  RUST_LOG = "lopi=info,tower_http=warn"

# Secrets (set via `fly secrets set`):
#   LOPI_WEB_AUTH_TOKEN        — Bearer token protecting /api/* on the Forge

# ─── Compute ───────────────────────────────────────────────────────────────────

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
