[package]
name = "lopi-recon-fixtures"
version = "0.0.0"
edition = "2021"
publish = false

# Sprint U-0 (dashboard recon) — a dev-only fixture server that seeds a
# throwaway SQLite store with fixed IDs/timestamps and, for the "live"
# states, replays a deterministic AgentEvent sequence over the real
# lopi-ui axum app so Playwright can photograph states that only exist
# transiently on a real dashboard. Never wired into any production path,
# never spawns `AgentPool::run()` (no dispatch loop, no `claude` subprocess).
#
# Detached from the root workspace on purpose — mirrors fuzz/Cargo.toml's
# own rationale: this must never be picked up by
# `cargo build --workspace`/`cargo test --workspace`.
[dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.7", features = ["ws"] }

lopi-core = { path = "../../../crates/lopi-core" }
lopi-memory = { path = "../../../crates/lopi-memory" }
lopi-orchestrator = { path = "../../../crates/lopi-orchestrator" }
lopi-ui = { path = "../../../crates/lopi-ui" }

[[bin]]
name = "fixture-server"
path = "src/main.rs"

[workspace]
